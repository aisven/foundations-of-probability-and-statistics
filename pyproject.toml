[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=84.0.0"]


[project]
name = "foundations-of-probability-and-statistics"
dynamic = ["version"]
description = "Introduction to certain concepts with code for educational purposes."
authors = [
  {name = "Sven"},
]
maintainers = [
  {name = "Sven"},
]
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "scipy>=1.18.1",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.16.7",
]
test = [
    "pytest>=9.1.1",
#    "pytest-asyncio>=1.4.0",
    "pytest-order>=1.5.0",
    "pytest-sugar>=1.1.1",
    "pytest-cov>=7.1.0",
]


[tool.setuptools.dynamic]
version = {attr = "foundations_of_probability_and_statistics.__version__"}


[tool.setuptools.packages.find]
where = ["."]
include = ["foundations_of_probability_and_statistics*"]
namespaces = false


[tool.ruff]
target-version = "py314"
line-length = 160
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "protobuf",
    ".proto",
]


[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []


[tool.pytest.ini_options]
minversion = "9.1"
pythonpath = [
  "."
]
addopts = "-vv -s"
# asyncio_mode = "strict"
